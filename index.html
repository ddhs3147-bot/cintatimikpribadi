<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untuk Kamu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8e9ef; --surface:#fff6f9; --ink:#3b2036; --muted:#7d5f76; --accent:#c2395f; --accent-ink:#fff; --line:#e8cbd8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#2a1727; --surface:#38203a; --ink:#fbe8f0; --muted:#d2aec4; --accent:#ff7fa3; --accent-ink:#3b1030; --line:#573455; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#2a1727; --surface:#38203a; --ink:#fbe8f0; --muted:#d2aec4; --accent:#ff7fa3; --accent-ink:#3b1030; --line:#573455; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.65}
main{max-width:34rem;margin:0 auto;padding:3.5rem 1.4rem 4rem}
h1,h2{font-family:"Caveat","Segoe Script","Bradley Hand",cursive;font-weight:700;line-height:1.05;margin:0}
h1{font-size:clamp(3.6rem,17vw,5.6rem);color:var(--accent);transform:rotate(-2deg);margin-bottom:1rem}
h2{font-size:2.2rem;margin-bottom:.6rem}
.lead{color:var(--muted);margin:0 0 3rem;max-width:26rem}
section{margin-top:3.2rem}
.days{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:1rem}
.days b{font-family:"Caveat",cursive;font-size:5rem;line-height:1;color:var(--accent)}
.days span{color:var(--muted)}
.since{color:var(--muted);font-size:.95rem;margin:.6rem 0 0}
.reason{min-height:7.5rem;background:var(--surface);border:1px solid var(--line);border-radius:1.2rem 1.2rem 1.2rem .3rem;padding:1.2rem 1.3rem;font-size:1.15rem;margin:1rem 0}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:.8rem 1.5rem;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:.4rem;padding:1.6rem 1.4rem;font-size:1.05rem}
.letter p{margin:0 0 1rem}
.letter p:last-child{margin:0;font-family:"Caveat",cursive;font-size:1.8rem;color:var(--accent)}
main{position:relative;z-index:1}
.pop{animation:pop .35s ease-out}
.muncul{opacity:0}
.muncul.tampil{animation:pop .7s ease-out forwards}
.melayang{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.melayang span{position:absolute;bottom:-3rem;opacity:0;animation:naik linear infinite}
@keyframes naik{0%{transform:translateY(0) rotate(-10deg);opacity:0}10%{opacity:.55}90%{opacity:.55}100%{transform:translateY(-115vh) rotate(12deg);opacity:0}}
.letup{position:fixed;pointer-events:none;z-index:5;animation:letup .9s ease-out forwards}
@keyframes letup{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
#judul{animation:detak 1.6s ease-in-out infinite;transform-origin:left center}
@keyframes detak{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(-2deg) scale(1.04)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop,#judul{animation:none}button:active{transform:none}.muncul{opacity:1}.muncul.tampil{animation:none}.melayang,.letup{display:none}}
</style>
</head>
<body>
<main>
  <h1 id="judul">Hai, sayang</h1>
  <p class="lead">Halaman kecil ini aku buat khusus buat kamu. Tidak besar, tapi isinya jujur.</p>

  <section aria-labelledby="hari">
    <h2 id="hari">Kita sudah bersama</h2>
    <div class="days"><b id="jumlah">0</b><span>hari</span></div>
    <p class="since" id="sejak"></p>
  </section>

  <section aria-labelledby="alasan">
    <h2 id="alasan">Alasan aku sayang kamu</h2>
    <div class="reason" id="teks" aria-live="polite">Tekan tombol di bawah.</div>
    <button id="tombol" type="button">Kasih satu alasan</button>
  </section>

  <section aria-labelledby="surat">
    <h2 id="surat">Surat kecil</h2>
    <div class="letter" id="isi"></div>
  </section>
</main>

<script>
/* ====== Ganti bagian ini sesuai cerita kalian ====== */
var NAMA = "Astri";
var NAMA_LENGKAP = "Astri Agustiani";
var MULAI = "2022-11-06";           // tanggal jadian (YYYY-MM-DD)
var ALASAN = [
  "Kamu bikin hari yang biasa saja terasa lebih ringan.",
  "Tawamu itu favoritku, apalagi kalau kamu sendiri tidak sadar sedang tertawa.",
  "Kamu sabar sama aku, bahkan pas aku lagi menyebalkan.",
  "Kamu peduli sama hal-hal kecil yang orang lain lewatkan.",
  "Dekat kamu, aku boleh jadi diri sendiri.",
  "Kamu bikin aku pengin jadi orang yang lebih baik."
];
var SURAT = [
  "Aku tidak pandai bikin kata-kata yang indah, jadi aku bikin ini saja.",
  "Terima kasih sudah ada, sudah mau mendengar, dan sudah memilih aku di hari-hari yang tidak mudah maupun yang menyenangkan.",
  "Apa pun yang terjadi besok, aku mau terus ada di sampingmu.",
  "Sabar ya adekk, aku mau pulang. Besok kita ketemu cantikk",
  "Dari aku, yang selalu sayang kamu."
];
/* ================================================= */

document.getElementById("judul").textContent = "Hai, " + NAMA + " ❤️";
document.title = "Untuk " + NAMA_LENGKAP;

var mulai = new Date(MULAI + "T00:00:00");
var hari = Math.max(0, Math.floor((Date.now() - mulai.getTime()) / 86400000));
document.getElementById("jumlah").textContent = hari.toLocaleString("id-ID");
document.getElementById("sejak").textContent = "Sejak " + mulai.toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});

var surat = document.getElementById("isi");
var paragraf = [];
SURAT.forEach(function(t, idx){ var p = document.createElement("p"); p.textContent = t + " ❤️"; p.className = "muncul"; p.style.animationDelay = (idx * 0.7) + "s"; surat.appendChild(p); paragraf.push(p); });
function tampilkan(){ paragraf.forEach(function(p){ p.classList.add("tampil"); }); }
if ("IntersectionObserver" in window) { var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting) { tampilkan(); io.disconnect(); } }, {threshold:.25}); io.observe(surat); } else { tampilkan(); }

var terakhir = -1, teks = document.getElementById("teks");
document.getElementById("tombol").addEventListener("click", function(){
  var i;
  do { i = Math.floor(Math.random() * ALASAN.length); } while (i === terakhir && ALASAN.length > 1);
  terakhir = i;
  teks.textContent = ALASAN[i] + " ❤️";
  teks.classList.remove("pop"); void teks.offsetWidth; teks.classList.add("pop");
  this.textContent = "Satu lagi"; ledak(this);
});
var ikon = ["❤️","💕","💗","💖"];
var wadah = document.createElement("div"); wadah.className = "melayang"; wadah.setAttribute("aria-hidden","true"); document.body.appendChild(wadah);
for (var k = 0; k < 14; k++) { var s = document.createElement("span"); s.textContent = ikon[k % 4]; s.style.left = (Math.random()*94) + "%"; s.style.fontSize = (14 + Math.random()*18) + "px"; s.style.animationDuration = (9 + Math.random()*9) + "s"; s.style.animationDelay = (-Math.random()*14) + "s"; wadah.appendChild(s); }
function ledak(el){
  var r = el.getBoundingClientRect();
  for (var n = 0; n < 8; n++) {
    var h = document.createElement("span"); h.className = "letup"; h.textContent = ikon[n % 4];
    h.style.left = (r.left + r.width/2) + "px"; h.style.top = (r.top + r.height/2) + "px";
    var a = (Math.PI * 2 * n / 8), d = 60 + Math.random()*40;
    h.style.setProperty("--dx", Math.cos(a)*d + "px"); h.style.setProperty("--dy", (Math.sin(a)*d - 30) + "px");
    h.addEventListener("animationend", function(){ this.remove(); });
    document.body.appendChild(h);
  }
}
</script>
</body>
</html>
